name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (package)
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Run package tests
        run: flutter test

      - name: Run native Android emulator classifier tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I src/native/src/platform/android \
            src/native/src/platform/android/android_emulator_classifier.cpp \
            test/native/android_emulator_classifier_test.cpp \
            -o /tmp/flutter_defender_emulator_test
          /tmp/flutter_defender_emulator_test

      - name: Install dependencies (example)
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Run example tests
        working-directory: example
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Run Android plugin unit tests
        run: gradle --project-dir example/android :flutter_defender:testDebugUnitTest
